<html>

<link rel="stylesheet" href="template-dnd/template-dnd.css">

<style>
    .template-box {
        width: 100%;
        height: 300px;
        border: 1px solid #3d3d3d;
        padding: 10px;
        box-sizing: border-box;
    }

    .template-result {
        width: 100%;
        height: 300px;
        border: 1px solid #3d3d3d;
        padding: 10px;
        box-sizing: border-box;
        margin-top: 10px;
    }

    .report {
        width: 100%;
        height: 300px;
        border: 1px solid #3d3d3d;
        padding: 10px;
        box-sizing: border-box;
        margin-top: 10px;
    }

    .draggable-item {
        margin: 2px 4px;
        padding: 5px;
        display: inline-block;
        border: 1px solid #3d3d3d;
        background-color: #9ed99e;
        cursor: grab;
        user-select: none;
    }

    .comment-chip {
        margin: 2px 4px;
        padding: 5px;
        display: inline-block;
        border: 1px solid #3d3d3d;
        background-color: #9ed99e;
        user-select: none;
    }


    .draggable-container {
        min-height: 50px;
        margin-bottom: 10px;
    }

    .delete {
        cursor: pointer;
    }
</style>

<body>

<div class="draggable-container">
    <div class="draggable-item" data-key="max-hr">
        Max HR <a class="delete"> X</a>
    </div>
    <div class="draggable-item" data-key="min-hr">
        Min HR <a class="delete"> X</a>
    </div>
    <div class="draggable-item" data-key="avg-hr">
        Avg HR <a class="delete"> X</a>
    </div>
    <div class="draggable-item" data-key="total-sve">
        Total SVE% <a class="delete"> X</a>
    </div>
    <div class="draggable-item" data-key="couplet">
        couplet <a class="delete"> X</a>
    </div>
    <div class="draggable-item" data-key="runs-runsbeat">
        Runs & Runs beat <a class="delete"> X</a>
    </div>
</div>

<div>
    <h2>Template</h2>
</div>
<div class="template-box" contenteditable="true">

</div>

<div><br></div>
<div>
    <input type="button" value="Apply Template to Comment" id="generate-report">
    <input type="button" value="Update Chip" id="update-chip">
</div>
<div><br></div>
<div>
    <label for="max-hr">Max HR</label>
    <input type="number" id="max-hr" placeholder="Max HR" value="130">
    <label for="min-hr">Min HR</label>
    <input type="number" id="min-hr" placeholder="Min HR" value="60">
    <label for="avg-hr">Avg HR</label>
    <input type="number" id="avg-hr" placeholder="Avg HR" value="80">
    <label for="total-sve">Total SVE%</label>
    <input type="number" id="total-sve" placeholder="Total SVE%" value="50">
    <br>
    <label for="couplet">Couplet</label>
    <input type="number" id="couplet" placeholder="Couplet" value="2">
    <br>
    <label for="runs">Runs</label>
    <input type="number" id="runs" placeholder="Runs" value="1">
    <label for="runs-beat">Runs beat</label>
    <input type="number" id="runs-beat" placeholder="Runs beat" value="3">
    <label for="runs-last">Runs last</label>
    <input type="number" id="runs-last" placeholder="Runs last" value="34">
    <label for="runs-bpm">Runs BPM</label>
    <input type="number" id="runs-bpm" placeholder="Runs BPM" value="150">
</div>

<div><h2>Comment</h2></div>
<div class="template-result" contenteditable="true">

</div>

<div><br></div>
<div>
    <input type="button" value="Export report from Comment" id="export-report">
</div>

<div><h2>Generated Report Document</h2></div>
<div class = "report">

</div>

</body>
</html>

<script type="module">
    import {TemplateDnD} from './template-dnd/template-dnd.js';

    const plural = (one, many, zero = '') => n =>
        n === 0 ? zero : n === 1 ? one : many.replace('{n}', n);

    const runsRunsbeatValue = () => {
        const runs = Number(document.getElementById('runs').value);
        const runsBeat = Number(document.getElementById('runs-beat').value);
        const runsLast = Number(document.getElementById('runs-last').value);
        const runsBpm = Number(document.getElementById('runs-bpm').value);
        if( runs === 0) return "";
        if (runs === 1 && runsBeat === 3){
            return "a triplet, ";
        }
        if( runs === 1 && runsBeat >= 4){
            return `a short run of AT, longest ${runsBeat} beats run (lasting ${runsLast}s, max ${runsBpm} bpm), `;
        }
        if(runs >= 2) {
            return `short runs of AT, longest ${runsBeat} beats run (lasting ${runsLast}s, max ${runsBpm} bpm), `;
        }

    };

    const draggableItemValue = {
        "max-hr": {value: () => Number(document.getElementById('max-hr').value)},
        "min-hr": {value: () => Number(document.getElementById('min-hr').value)},
        "avg-hr": {value: () => Number(document.getElementById('avg-hr').value)},
        "total-sve": {value: () => Number(document.getElementById('total-sve').value)+"%"},
        "couplet": {
            value: () => Number(document.getElementById('couplet').value),
            format: plural('a couplet, ', 'couplets, ')
        },
        "runs-runsbeat": {value: runsRunsbeatValue}
    };

    const BLOCK_TAGS = new Set(['DIV', 'P', 'LI']);

    // 각 줄의 마지막에 남은 ','(뒤 공백 포함)를 제거
    const trimTrailingCommas = root => {
        root.normalize(); // 치환으로 쪼개진 인접 텍스트 노드를 합침
        let lastText = null; // 현재 줄에서 내용이 있는 마지막 텍스트 노드

        const endLine = () => {
            if (lastText) lastText.data = lastText.data.replace(/,\s*$/, '');
            lastText = null;
        };

        const walk = node => {
            for (const child of node.childNodes) {
                if (child.nodeType === Node.TEXT_NODE) {
                    if (child.data.trim()) lastText = child; // 공백/빈 문자열(빈 치환 결과)은 건너뜀
                } else if (child.nodeName === 'BR') {
                    endLine();
                } else if (BLOCK_TAGS.has(child.nodeName) && !child.classList.contains('comment-chip')) {
                    endLine(); // 블록 시작 = 이전 줄 끝
                    walk(child);
                    endLine(); // 블록 끝 = 이 줄 끝
                } else {
                    walk(child); // span, b 같은 inline 요소는 같은 줄로 취급
                }
            }
        };

        walk(root);
        endLine(); // 마지막 줄
        return root;
    };

    const dnd = new TemplateDnD({
        container: '.draggable-container',
        editor: '.template-box',
    });

    // ---- Generate Report: template-box의 아이템을 draggableItemValue 값으로 치환해 template-result에 출력 ----
    const templateResult = document.querySelector('.template-result');

    // key에 해당하는 현재 input 값 기준 텍스트
    const itemText = key => {
        const def = draggableItemValue[key];
        const v = def.value();
        return String((def.format ? def.format(v) : v) ?? '');
    };

    document.getElementById('generate-report').addEventListener('click', () => {
        const result = dnd.serialize(item => {
            if (!draggableItemValue[item.dataset.key]) return `{${item.dataset.key}}`; // 값이 없으면 key 그대로 표시
            const text = itemText(item.dataset.key);
            if (!text) return ''; // 빈 결과(예: runs 0)는 chip 없이 생략

            const chip = document.createElement('div');
            chip.className = 'comment-chip';
            chip.dataset.templateid = item.dataset.key;
            chip.contentEditable = 'false'; // chip 내용은 수정 불가 (chip 단위로 삭제/이동만 가능)
            chip.textContent = text;
            return chip;
        });
        templateResult.replaceChildren(trimTrailingCommas(result));
    });

    // ---- Update Chip: template-result의 chip 텍스트를 현재 input 값으로 갱신 ----
    document.getElementById('update-chip').addEventListener('click', () => {
        templateResult.querySelectorAll('.comment-chip').forEach(chip => {
            if (draggableItemValue[chip.dataset.templateid]) chip.textContent = itemText(chip.dataset.templateid);
        });
        trimTrailingCommas(templateResult); // 갱신으로 다시 붙은 줄 끝 ','를 제거
    });

    // ---- Export Report: template-result의 chip 태그를 벗기고 텍스트만 남겨 report에 출력 ----
    const report = document.querySelector('.report');

    document.getElementById('export-report').addEventListener('click', () => {
        const copy = templateResult.cloneNode(true); // 원본 Comment는 그대로 유지
        copy.querySelectorAll('.comment-chip').forEach(chip => chip.replaceWith(chip.textContent));
        copy.normalize(); // chip 자리의 텍스트를 앞뒤 텍스트와 합침
        report.replaceChildren(...copy.childNodes); // 줄바꿈(<div>, <br>) 구조 유지
    });
</script>
